name: Publish Package

on:
  push:
    branches: [main]

permissions:
  id-token: write        # npm Trusted Publishing (OIDC)
  contents: write        # push version bump commit + tag back to main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci
      - run: npm run build --if-present

      - name: Bump version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bump without auto-creating a tag, in case a previous run left the tag behind.
          NEW_VERSION=$(npm version patch --no-git-tag-version | sed 's/^v//')

          git add package.json package-lock.json
          git commit -m "chore(release): v${NEW_VERSION}"

          # Create the tag only if it does not already exist (locally or on remote).
          if ! git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            git tag "v${NEW_VERSION}"
          fi

          git push origin HEAD:main --follow-tags

      - run: npm publish --provenance --access public
